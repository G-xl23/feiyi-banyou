# 非遗伴游 HeritageTravel Agents —— Nginx 反向代理配置
#
# 何时需要：想让评审用 `http://域名` 或 `http://IP`（不带 :3000）访问时套一层 Nginx。
#           若直接用 http://公网IP:3000 访问，则无需 Nginx。
#
# 安装（Ubuntu）：
#   sudo cp deploy/nginx-feiyi-banyou.conf /etc/nginx/sites-available/feiyi-banyou
#   sudo ln -sf /etc/nginx/sites-available/feiyi-banyou /etc/nginx/sites-enabled/feiyi-banyou
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 中国大陆节点：用域名走 80/443 需完成 ICP 备案，否则可能被云厂商拦截。
#    未备案时请直接用 http://公网IP:3000，或把本文件里的 listen 改成 8080 等非敏感端口。

server {
    listen 80;
    listen [::]:80;

    # 用 IP 访问时保持下划线；绑域名时改成 your-domain.com
    server_name _;

    # 静态资源与 API 都由 Node 服务托管，整体反向代理即可
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（多智能体协作链路 /api/orchestrate/stream、/api/advisor/stream）
        # 必须关闭缓冲，否则前端收不到实时步骤事件，只能一次性拿到最终结果
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # 大模型单次调用可能十几秒，超时给足（不要用默认 60s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json;

    access_log /var/log/nginx/feiyi-banyou.access.log;
    error_log  /var/log/nginx/feiyi-banyou.error.log;
}

# ============================================================
